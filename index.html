<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NOVARA — Placement Preparation</title>
    <meta name="description" content="NOVARA is an AI-powered placement preparation platform. Turn your placement roadmap into a structured daily preparation journey." />
    
    <!-- Synchronous Zero-Flash Theme Initialization -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('novara_theme_preference');
          var theme = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
          var resolved = theme;
          if (theme === 'system') {
            resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-preference', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#141716' : '#C85A32');
        } catch (e) {}
      })();
    </script>

    <!-- PWA & Mobile Web Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C85A32" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NOVARA" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    
    <!-- Google Identity Services (OAuth 2.0 / GIS) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-grid-pattern">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
